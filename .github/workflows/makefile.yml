name: Build Alioth Kernel (BuildJet Fast)
on:
  workflow_dispatch:

jobs:
  build:
    # [关键修改] 这里不再是 ubuntu-22.04，而是 BuildJet 的高性能机器
    # 推荐使用 16核 (16vcpu) 或 8核 (8vcpu)，编译速度起飞
    runs-on: buildjet-16vcpu-ubuntu-2204

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # [BuildJet 优化] 使用 BuildJet 的高速缓存 (可选，但推荐)
    # 这里为了演示先保持简单，如果你想用缓存可以参考文档替换 actions/cache
    
    # 安装依赖
    - name: Install dependencies
      run: |
        sudo apt update && sudo apt upgrade -y
        sudo apt install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python-is-python3 tar

    # 下载工具链
    - name: Setup zyc-clang toolchain
      run: |
        # BuildJet 的 Home 目录是 /home/ubuntu，使用 $HOME 变量是兼容的
        mkdir -p $HOME/zyc-clang
        cd $HOME/zyc-clang
        wget https://github.com/ZyCromerZ/Clang/releases/download/15.0.7-20251111-release/Clang-15.0.7-20251111.tar.gz
        tar -zxvf Clang-15.0.7-20251111.tar.gz
        rm Clang-15.0.7-20251111.tar.gz

    # 赋予脚本权限
    - name: Make script executable
      run: chmod +x build.sh

    # 开始编译
    - name: Build Kernel
      run: |
        # BuildJet 性能很强，这里直接跑
        bash build.sh

    # 上传产物
    - name: Upload zip
      uses: actions/upload-artifact@v4
      with:
        name: Kernel_Alioth_BuildJet
        path: Kernel_Alioth_*.zip
